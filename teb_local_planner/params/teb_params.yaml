controller_server:
  ros__parameters:
    odom_topic: /odom
    use_sim_time: True
    controller_frequency: 5.0
    controller_plugin_types: ["teb_local_planner::TebLocalPlannerROS"]
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: teb_local_planner::TebLocalPlannerROS

      teb_autosize: 1.0
      dt_ref: 0.3
      dt_hysteresis: 0.1
      max_samples: 500
      global_plan_overwrite_orientation: False
      allow_init_with_backwards_motion: False
      max_global_plan_lookahead_dist: 3.0
      transform_global_plan_costmap_span_scale: 1.0  # plan-length cap & row-end search = scale * max(costmap full x,y) [m]; <=0 disables
      transformed_plan_collision_pose_to_end_distance: 1.0  # free tail after last collision on current row [m]
      transformed_plan_collision_pose_safe_distance_front: 0.4  # fallback: min along-path gap if terminal is behind occupied [m]
      transformed_plan_collision_pose_safe_distance_back: 1.0  # fallback: min along-path gap if terminal is past occupied [m]
      transformed_plan_row_terminal_arrive_distance: 1.0  # arrived at row-terminal safe pose → prune remaining row [m]
      cut_path_before_corner_lethal_dist: 1.0
      cut_path_before_corner_inscribed_dist: 1.5
      prune_before_corner_distance: 4.0   # unused by arrived-corner prune; kept for ray/legacy
      prune_corner_residual_distance: 0.5  # unused by arrived-corner prune; kept for yaml compatibility
      prune_before_corner_linear_x_threshold: 0.1  # |linear.x| must be below this to prune at corner obstacle [m/s]
      last_corner_record_distance: 0.3  # along-path arc from closest pose to locked corner to prune that corner [m]
      last_corner_distinct_distance: 0.2  # unused (no spatial dedup); kept for yaml compatibility
      corner_approach_ray_check_enable: true
      corner_approach_check_sample_spacing: 0.2
      corner_approach_check_cost_mode: both  # both | lethal | inscribed
      corner_approach_check_margin: -1.0  # <0: use min_obstacle_dist; >=0: fixed body-frame pad [m]
      corner_approach_footprint_marker_enable: false
      global_plan_viapoint_sep: 0.3
      global_plan_prune_distance: 1.0
      global_plan_prune_max_accum_dist: 8.0   # <=0: search full path for prune point
      prune_angle_threshold: 90.0  # [deg] pruneGlobalPlan heading align vs robot yaw
      rough_global_plan_prune_distance: 3.0   # coarse-pass prune distance [m]; <=0 disables coarse pass
      rough_global_plan_prune_max_accum_dist: -1.0  # coarse-pass search range [m]; <=0 searches entire plan
      exact_arc_length: False
      feasibility_check_no_poses: 2
      # 劣弧 TEB 不可行时优弧展开 yaw 再优化；heading_threshold=0 表示一侧失败即试另一侧
      major_arc_retry_enable: True
      major_arc_retry_heading_threshold: 0.0
      # 优弧锁停滞看门狗：timeout 内剩余转角下降不足 yaw、位移也不足 xy 则解锁；timeout<=0 关闭
      major_arc_stagnation_timeout: 2.0
      major_arc_stagnation_yaw: 0.15
      major_arc_stagnation_xy: 0.06
      # 双弧均失败：连续 fail_num 次后降 forward_drive 并 latch；连续前进 + min_hold 切回；timeout probe 高权重
      dual_arc_reverse_enable: True
      dual_arc_reverse_fail_num: 3
      dual_arc_reverse_min_hold: 10.0
      dual_arc_reverse_timeout: 20.0
      dual_arc_reverse_forward_vx: 0.2
      dual_arc_reverse_forward_num: 10
      dual_arc_reverse_publish_backward_mode: True
      # Contour feasibility (see 动态障碍物避让.md)
      feasibility_check_obstacle_contours: True
      feasibility_check_dynamic_prediction: True
      feas_contour_margin: 0.0
      feas_pred_T: 1.0
      feas_pred_R: 3.0
      feas_pred_gate_mode: "both_or"  # rel | abs | both_or
      feas_pred_delta_omega_abs: 0.8
      feas_pred_delta_omega_rel: -1.0  # <=0 → delta_omega_scale * max_vel_theta
      feas_pred_v_min: 0.05
      publish_feedback: False
      publish_dynamic_obstacle_debug: False  # RViz: teb_dynamic_obstacle_debug
      dynamic_obstacle_debug_pose_stride: 1
      dynamic_obstacle_debug_time_z_scale: 1.0  # z=scale*t; same-t footprint & obstacle share height (0=flat)
          
      # Robot
              
      max_vel_x: 0.26
      # 不再用此开关把 vx 下界钉成 0（会导致优化无解）；倒车由 max_vel_x_backwards 限制，前进偏好用 weight_kinematics_forward_drive
      prefer_forward_only: True
      max_vel_theta: 1.0 
      acc_lim_x: 2.5
      acc_lim_theta: 3.2

      footprint_model: # types: "point", "circular", "two_circles", "line", "polygon"
        type: "circular"
        radius: 0.17 # for type "circular"

      # GoalTolerance
              
      free_goal_vel: False
          
      # Obstacles
          
      min_obstacle_dist: 0.27
      inflation_dist: 0.6
      include_costmap_obstacles: True
      costmap_obstacles_behind_robot_dist: 1.0
      obstacle_poses_affected: 15

      dynamic_obstacle_inflation_dist: 0.6
      include_dynamic_obstacles: True

      # Near-horizon predictable dynamic safety (see 动态障碍物避让.md)
      dynamic_safety_predictable_mode: True
      dynamic_obstacles_as_static_edges: True
      dynamic_obstacle_cache_time: 0.3
      dyn_gate_T_near: 1.0
      dyn_gate_v_x_max: 2.0
      dyn_gate_omega_z_max: 1.0
      dyn_gate_inflation: 0.3
      dyn_gate_overlap_dist: 0.05
      dyn_gate_roi_front: 1.0
      dyn_gate_roi_rear: 1.0
      dyn_gate_roi_left: 1.0
      dyn_gate_roi_right: 1.0
      dyn_gate_hold_time: 0.3
      delta_omega_scale: 0.3
      publish_near_horizon_debug: True
      weight_near_horizon_omega_hold: 50.0

      costmap_converter_plugin: "costmap_converter::CostmapToPolygonsDBSMCCH"
      costmap_converter_spin_thread: True
      costmap_converter_rate: 5

      # Optimization
          
      no_inner_iterations: 5
      no_outer_iterations: 4
      optimization_activate: True
      optimization_verbose: False
      penalty_epsilon: 0.1
      obstacle_cost_exponent: 4.0
      weight_max_vel_x: 0.5
      weight_max_vel_theta: 0.5
      weight_acc_lim_x: 0.5
      weight_acc_lim_theta: 10.5
      weight_kinematics_nh: 1000.0
      weight_kinematics_forward_drive: 3.0
      weight_kinematics_turning_radius: 1.0
      weight_optimaltime: 1.0 # must be > 0
      weight_shortest_path: 0.0
      weight_obstacle: 100.0
      weight_inflation: 0.2
      weight_dynamic_obstacle: 10.0 # not in use yet
      weight_dynamic_obstacle_inflation: 0.2
      weight_viapoint: 50.0
      weight_adapt_factor: 2.0

      # Wall side clearance (scheme A); enable on edge-following robots
      wall_side_clearance_mode: true
      desired_side_clearance: 0.08
      side_clearance_push: 0.05
      side_clearance_attract_max: 0.35
      weight_wall_side_pull: 80.0
      weight_wall_side_push: 200.0
      weight_wall_line_dist: 40.0
      # 贴边模式膨胀权重（切换时覆盖 weight_inflation）；0 避免路缘膨胀顶开贴边
      edge_weight_inflation: 0.0
      # 贴边/障碍代价调试日志间隔 [s]；<=0 关闭
      debug_wall_obstacle_cost_interval: 1.0

      # Homotopy Class Planner

      enable_homotopy_class_planning: True
      enable_multithreading: True
      max_number_classes: 4
      selection_cost_hysteresis: 5.0
      selection_prefer_initial_plan: 1.0
      selection_obst_cost_scale: 1.0
      selection_alternative_time_cost: True

      roadmap_graph_no_samples: 15
      roadmap_graph_area_width: 5.0
      roadmap_graph_area_length_scale: 1.0
      h_signature_prescaler: 0.5
      h_signature_threshold: 0.1
      obstacle_heading_threshold: 0.45
      switching_blocking_period: 0.0
      viapoints_all_candidates: True
      delete_detours_backwards: True
      max_ratio_detours_duration_best_duration: 3.0
      visualize_hc_graph: False
      visualize_with_time_as_z_axis_scale: 0.0

      # Recovery
      
      shrink_horizon_backup: True
      shrink_horizon_min_duration: 10.0
      oscillation_recovery: True
      oscillation_v_eps: 0.1
      oscillation_omega_eps: 0.1
      oscillation_recovery_min_duration: 10.0
      oscillation_filter_duration: 10.0
